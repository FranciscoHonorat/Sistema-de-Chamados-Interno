{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sys-called.secretName" . }}
  labels:
    {{- include "sys-called.labels" . | nindent 4 }}
  annotations:
    # Keeps the database password and the signing key through an uninstall,
    # so a reinstall still opens the old volume and honours issued sessions.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ include "sys-called.secretValue" (dict "root" . "key" "postgres-password" "value" .Values.postgresql.password "generate" (randAlphaNum 32)) }}
  {{- end }}
  jwt-private-key: {{ include "sys-called.secretValue" (dict "root" . "key" "jwt-private-key" "value" .Values.secrets.jwtPrivateKey "generate" (genPrivateKey "ed25519")) }}
{{- end }}
