{{- if .Values.networkPolicy.enabled }}
# The app takes HTTP from anywhere (ingress controller, NodePort) and metrics
# scrapes; Postgres only takes connections from the app.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sys-called.name" . }}-app
  labels:
    {{- include "sys-called.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sys-called.selector" (dict "root" . "component" "app") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
        - port: metrics
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sys-called.name" . }}-postgres
  labels:
    {{- include "sys-called.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sys-called.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "sys-called.selector" (dict "root" . "component" "app") | nindent 14 }}
      ports:
        - port: postgres
{{- end }}
{{- end }}
