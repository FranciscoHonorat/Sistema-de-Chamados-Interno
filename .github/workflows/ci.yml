name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests only care about their latest commit; main and tags always
  # finish, because they end in a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: sys-called:ci

jobs:
  backend:
    name: Backend · lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint (lint + gofmt/goimports)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5
          working-directory: backend

      - name: Unit, architecture and module-boundary tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  backend-integration:
    name: Backend · integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sys_called
          POSTGRES_PASSWORD: sys_called
          POSTGRES_DB: sys_called
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sys_called"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -p 1: the packages share the database, and the whole-app test runs an
      # outbox relay that would otherwise race the outbox store tests.
      - name: Migrations, repositories and the whole app over HTTP
        env:
          SYS_CALLED_TEST_DATABASE_URL: postgres://sys_called:sys_called@localhost:5432/sys_called?sslmode=disable
        run: go test -race -count=1 -p 1 ./...

  backend-security:
    name: Backend · vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: backend
          go-version-file: backend/go.mod
          go-package: ./...

  frontend:
    name: Frontend · lint, type-check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  image:
    name: Image · build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

