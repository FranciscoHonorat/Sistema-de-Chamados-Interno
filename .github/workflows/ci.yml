name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests only care about their latest commit; main and tags always
  # finish, because they end in a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: sys-called:ci

jobs:
  backend:
    name: Backend · lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: golangci-lint (lint + gofmt/goimports)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5
          working-directory: backend

      - name: Unit, architecture and module-boundary tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1 | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  backend-integration:
    name: Backend · integration (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sys_called
          POSTGRES_PASSWORD: sys_called
          POSTGRES_DB: sys_called
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sys_called"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # -p 1: the packages share the database, and the whole-app test runs an
      # outbox relay that would otherwise race the outbox store tests.
      - name: Migrations, repositories and the whole app over HTTP
        env:
          SYS_CALLED_TEST_DATABASE_URL: postgres://sys_called:sys_called@localhost:5432/sys_called?sslmode=disable
        run: go test -race -count=1 -p 1 ./...

  backend-security:
    name: Backend · vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: golang/govulncheck-action@v1
        with:
          work-dir: backend
          go-version-file: backend/go.mod
          go-package: ./...

  frontend:
    name: Frontend · lint, type-check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sys_called
          POSTGRES_PASSWORD: sys_called
          POSTGRES_DB: sys_called
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sys_called"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build

      - name: Start the app
        working-directory: backend
        env:
          DATABASE_URL: postgres://sys_called:sys_called@localhost:5432/sys_called?sslmode=disable
          STATIC_DIR: ${{ github.workspace }}/frontend/dist
        run: |
          go build -o "$RUNNER_TEMP/sys-called" ./cmd/sys-called
          "$RUNNER_TEMP/sys-called" serve > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 60); do curl -sf http://localhost:8080/readyz && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/app.log"; exit 1

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the E2E tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  image:
    name: Image · build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=sys-called
          cache-to: type=gha,mode=max,scope=sys-called

      - name: The binary starts
        run: docker run --rm "$IMAGE" version

      - name: Trivy report
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Trivy gate
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Save the image
        run: docker save "$IMAGE" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  helm:
    name: Helm chart and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v4

      - name: helm lint and template
        run: make helm-lint

      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for values in "" values-dev.yaml values-staging.yaml values-production.yaml; do
            args=()
            if [ -n "$values" ]; then args=(-f "infra/helm/sys-called/$values"); fi
            helm template sys-called infra/helm/sys-called "${args[@]}" \
              | ./kubeconform -strict -summary -ignore-missing-schemas
          done

      - name: shellcheck
        run: shellcheck scripts/*.sh infra/scripts/*.sh

  smoke-compose:
    name: Smoke · Docker Compose
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: image

      - name: Load the image built by CI
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag "$IMAGE" sys-called:local

      - name: Start the stack
        run: |
          make env
          docker compose up -d --wait --no-build

      - name: Smoke test
        run: ./scripts/smoke-test.sh http://localhost:8000

      - name: Sessions and data survive a restart
        run: |
          docker compose restart app
          docker compose up -d --wait --no-build
          ./scripts/smoke-test.sh http://localhost:8000

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

  smoke-k8s:
    name: Smoke · Kubernetes
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: image

      - name: Load the image built by CI
        run: gunzip -c image.tar.gz | docker load

      - uses: azure/setup-helm@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: sys-called
          config: infra/kind/cluster.yaml

      - name: Install the chart
        run: IMAGE="$IMAGE" ./infra/scripts/k8s.sh up

      - name: helm test and smoke test
        run: ./infra/scripts/k8s.sh test

      - name: Rolling upgrade
        run: |
          docker tag "$IMAGE" sys-called:ci-upgrade
          IMAGE=sys-called:ci-upgrade ./infra/scripts/k8s.sh deploy
          ./infra/scripts/k8s.sh test

      - name: Cluster state
        if: failure()
        run: ./infra/scripts/k8s.sh status

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend, backend-integration, backend-security, frontend, e2e, image, helm, smoke-compose, smoke-k8s]
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
